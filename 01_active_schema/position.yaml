schema_name: active_schema_repository_position_contract
schema_version: "1.0.0"
document_role: REPOSITORY_POSITION_CONTRACT
conceptual_root: Hash_Relation_Track_DB

principles:
  - Position precedes property, role and name binding.
  - Identity is not position.
  - Position binds an independent object state to a field.
  - Repository boundaries remain independent.
  - Relation connects boundaries without merging them.
  - Existing closed or functional structures are preserved.
  - New Active_Schema structures enter through explicit extension positions.
  - before_position is not recursively imported into start_position.

branch_boundary:
  before_position:
    repository: SeungeFlow/Bridge
    branch: before_position
    role:
      - prior_formation_source
      - historical_evidence_field
      - selective_reference_source
    inheritance_to_start_position: false
    default_access: POINTER_ONLY

  start_position:
    repository: SeungeFlow/Bridge
    branch: start_position
    role:
      - new_canonical_formation_field
      - theory_projection_position
      - restart_reference_position
    generated_from_prior_material_revision: false

repositories:

  Bridge:
    repository: SeungeFlow/Bridge
    branch: start_position

    existing_repository_role:
      - migration_foundation
      - current_structure_entry
      - before_and_start_boundary_holder

    active_schema_projection:
      path: 01_active_schema/
      position_class: CANONICAL_THEORY_PROJECTION

    authoritative_for:
      - deployed_canonical_theory_projection
      - root_contract_projection
      - repository_position_contract_projection
      - active_schema_publication_reference
      - restart_reference
      - first_reading_order
      - optional_post_genesis_pointer

    phase_B0:
      required:
        - canonical_theory_projection
        - root_contract_projection
        - repository_position_contract_projection
        - active_schema_publication_reference
        - restart_reference
      prohibited:
        - genesis_binding_record_id
        - genesis_binding_storage_commit
        - canonical_genesis_binding_record_duplicate

    phase_B1:
      required: false
      allowed_after: Relation_G1
      may_add:
        - genesis_binding_pointer

    must_not_contain:
      - full_before_position_copy
      - runtime_seat_occupation_registry
      - complete_relation_registry
      - temporary_execution_logs_as_canonical_theory
      - AI_private_chain_of_thought
      - canonical_genesis_binding_record_duplicate

  for_instance:
    repository: SeungeFlow/for_instance
    branch: main

    existing_repository_role:
      - AI_instance_alignment
      - seat_model
      - instance_registry
      - capability_registry
      - assignment
      - handoff_interface
      - mutation_authority
      - assignment_history
      - operation
      - testing

    active_schema_binding_extension:
      path: 09_active_schema_binding/
      position_class: ACTIVE_SCHEMA_INSTANCE_ALIGNMENT_BINDING

    relation_to_existing_structure:
      type: BINDS_WITHOUT_REWRITING
      existing_seat_model_path: 01_seat_model/
      existing_relation_interface_path: 03_relation_interface/
      existing_assignment_path: 04_assignment/

    authoritative_for:
      - deployed_seat_definition_contract
      - active_schema_publication_reference
      - active_schema_root_reference
      - existing_seat_model_relation
      - cross_repository_handoff_contract
      - optional_post_genesis_reference

    phase_F0:
      required:
        - active_schema_publication_reference
        - seat_definition_contract_projection
        - existing_initial_structure_relation
        - cross_repository_handoff_contract
        - relation_registry_namespace_reference
      prohibited:
        - genesis_binding_record_id
        - genesis_binding_storage_commit

    phase_F1:
      required: false
      allowed_after: Relation_G1
      may_add:
        - genesis_binding_reference

    preservation_rules:
      existing_assignment_history:
        action: PRESERVE_AT_EXISTING_POSITION
        automatic_conversion_to_seat_occupation: false

      existing_coordinate_model:
        action: PRESERVE_AS_EXISTING_FUNCTIONAL_MODEL
        automatic_promotion_to_active_schema_canonical_view: false

    new_runtime_state_location:
      canonical_seat_occupation_registry:
        repository: SeungeFlow/Relation
        branch: main
        path: 05_hash_relation_track_registry/

    must_not_contain:
      - complete_relation_registry
      - complete_active_schema_package_duplicate
      - mandatory_private_reasoning_method
      - forced_fixed_runtime_population
      - retroactive_rewrite_of_existing_assignment_history

  Relation:
    repository: SeungeFlow/Relation
    branch: main

    existing_repository_role:
      - integrated_relation_system
      - relation_database
      - system_db_contract
      - book_package
      - audit_and_closure
      - open_runtime_scope

    initial_structure:
      lifecycle: CLOSED

      verified_closed_scope_base:
        commit: ff624832e5be2b195b8916113753b8b709574cfe
        tree: 6ac428f2f8e1f57f0a55d3b86e8a76415eb01a05

      closure_record_state:
        commit: cc4adf6891b53db0ec2e02ef4db8a1c9a9b41256
        tree_resolution: FROM_GIT_COMMIT_OBJECT

      mutation_rule:
        existing_closed_scope: DO_NOT_REWRITE_WITHOUT_DEFECT_EVIDENCE

    hash_relation_track_extension:
      path: 05_hash_relation_track_registry/
      position_class: APPEND_ONLY_RUNTIME_AND_SEMANTIC_REGISTRY
      relation_to_initial_structure: EXTENDS_CLOSED_SCOPE_WITHOUT_REWRITING

    authoritative_for:
      - relation_extension_origin
      - genesis_binding_record
      - semantic_identity_records
      - object_state_records
      - position_binding_records
      - semantic_relation_records
      - track_event_records
      - seat_occupation_records
      - closure_C_snapshot_records
      - runtime_evidence_bindings

    must_not_contain:
      - complete_git_history_duplicate
      - future_next_record_predeclaration
      - self_containing_commit_reference
      - silent_rewrite_of_closed_initial_structure
      - automatic_conversion_of_existing_for_instance_history
      - canonical_theory_as_untracked_duplicate

  Git:
    position_class: PHYSICAL_STATE_LINEAGE

    authoritative_for:
      - blob_identity
      - tree_identity
      - commit_identity
      - parent_relation
      - ref_state
      - branch_state
      - physical_diff
      - repository_history

    must_not_be_duplicated_as:
      - complete_manual_commit_graph
      - full_diff_replication
      - handwritten_blob_tree_commit_database

  Zenodo:
    position_class: PERMANENT_PUBLICATION_POSITION

    authoritative_for:
      - publication_root
      - DOI
      - published_active_schema_package
      - publication_metadata

    uploaded_artifact_policy:
      file_count: 1
      file_type: ZIP
      filename_rule: "<64-lowercase-sha256>.zip"
      sidecar_allowed: false

    must_not_be_treated_as:
      - runtime_database
      - mutable_github_repository
      - git_commit_identity
      - complete_operational_state

source_of_truth:
  canonical_theory_object: Active_Schema_package
  publication_identity: Zenodo
  physical_lineage: Git
  integrated_relation_system_db: SeungeFlow/Relation
  new_runtime_semantic_registry: SeungeFlow/Relation/05_hash_relation_track_registry/
  instance_alignment_repository: SeungeFlow/for_instance
  new_instance_binding_extension: SeungeFlow/for_instance/09_active_schema_binding/
  deployed_theory_projection: SeungeFlow/Bridge/start_position/01_active_schema/

selected_positions:
  Bridge: SeungeFlow/Bridge@start_position:01_active_schema/
  for_instance: SeungeFlow/for_instance@main:09_active_schema_binding/
  Relation: SeungeFlow/Relation@main:05_hash_relation_track_registry/

reality_audit:
  Gate_0A_repository_position_and_collision:
    result: PASS
    closure_state: CLOSED

  Gate_0B_pre_deployment_git_state:
    execution_time: IMMEDIATELY_BEFORE_GITHUB_MUTATION
    result_before_execution: HOLD
